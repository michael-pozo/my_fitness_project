# XcodeGen spec: run `xcodegen` in this folder to (re)create FitnessCoach.xcodeproj.
name: FitnessCoach
options:
  bundleIdPrefix: com.michaelpozo
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  FitnessCoach:
    type: application
    platform: iOS
    sources:
      - path: FitnessCoach
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michaelpozo.FitnessCoach
        PRODUCT_NAME: FitnessCoach
        INFOPLIST_KEY_CFBundleDisplayName: Fitness Coach
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ZZF6L6R3TB # Michael Pozo (Personal Team), free account
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        ENABLE_PREVIEWS: YES
